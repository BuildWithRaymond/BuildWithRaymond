<svg xmlns="http://www.w3.org/2000/svg" id="da-wiki-art" width="460" height="220" viewBox="0 0 460 220" role="img" aria-labelledby="da-wiki-title da-wiki-desc" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="da-wiki-title">UnoraWiki — Knowledge worth keeping together.</title>
<desc id="da-wiki-desc">A Dark Ages community wiki. Forked from Unora. Community fork with upstream credit. A small monoline category drawing constructs once and settles beside the stationary project name. It is decorative artwork, not an application identity. Reduced motion shows the complete drawing.</desc>
<style>
#da-wiki-art .draw {stroke-dasharray: 100 100;}
#da-wiki-art .gesture-0 {animation: da-wiki-draw 0.4s cubic-bezier(.16,1,.3,1) 0.1s 1 both;}
#da-wiki-art .gesture-1 {animation: da-wiki-draw 0.62s cubic-bezier(.22,.7,.2,1) 0.2s 1 both;}
#da-wiki-art .gesture-2 {animation: da-wiki-draw 0.36s cubic-bezier(.16,1,.3,1) 0.56s 1 both;}
@keyframes da-wiki-draw {from {stroke-dashoffset: 100;} to {stroke-dashoffset: 0;}}
@media (prefers-reduced-motion: reduce) {
#da-wiki-art .motion, #da-wiki-art .motion * {animation: none !important; transition: none !important; transform: none !important; opacity: 1 !important; stroke-dasharray: none !important; stroke-dashoffset: 0 !important;}
}
</style>
<rect width="460" height="220" fill="#1F1F1F"/>
<rect x="28" y="28" width="46" height="5" fill="#FF6A00"/>
<text x="25" y="107" fill="#F3EEE7" font-size="53" font-weight="600" letter-spacing="-2.4">UnoraWiki</text>
<text x="28" y="153" fill="#F3EEE7" font-size="25" font-weight="400" letter-spacing="-.5">Community wiki / Fork</text>
