<svg xmlns="http://www.w3.org/2000/svg" id="da-wiki-art" width="460" height="220" viewBox="0 0 460 220" role="img" aria-labelledby="da-wiki-title da-wiki-desc" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="da-wiki-title">UnoraWiki — Knowledge worth keeping together.</title>
<desc id="da-wiki-desc">A Dark Ages community wiki. Forked from Unora. Community fork with upstream credit. A small monoline category drawing repeats a forward construction and gentle fade over a complete static track. It is decorative artwork, not an application identity. Reduced motion shows the complete drawing.</desc>
<style>
#da-wiki-art .draw {stroke-dasharray: 100 100;}
#da-wiki-art .gesture-0 {animation: da-wiki-draw-0 4.0s linear 0.1s infinite both;}
@keyframes da-wiki-draw-0 {0% {stroke-dashoffset: 100; opacity: 0; animation-timing-function: linear;}4% {stroke-dashoffset: 100; opacity: 1; animation-timing-function: cubic-bezier(.16,1,.3,1);}14.000% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: linear;}57% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(.4,0,1,1);}72% {stroke-dashoffset: 0; opacity: 0; animation-timing-function: steps(1,end);}73%,100% {stroke-dashoffset: 100; opacity: 0;}}
#da-wiki-art .gesture-1 {animation: da-wiki-draw-1 4.0s linear 0.2s infinite both;}
@keyframes da-wiki-draw-1 {0% {stroke-dashoffset: 100; opacity: 0; animation-timing-function: linear;}4% {stroke-dashoffset: 100; opacity: 1; animation-timing-function: cubic-bezier(.22,.7,.2,1);}19.500% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: linear;}57% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(.4,0,1,1);}72% {stroke-dashoffset: 0; opacity: 0; animation-timing-function: steps(1,end);}73%,100% {stroke-dashoffset: 100; opacity: 0;}}
#da-wiki-art .gesture-2 {animation: da-wiki-draw-2 4.0s linear 0.56s infinite both;}
@keyframes da-wiki-draw-2 {0% {stroke-dashoffset: 100; opacity: 0; animation-timing-function: linear;}4% {stroke-dashoffset: 100; opacity: 1; animation-timing-function: cubic-bezier(.16,1,.3,1);}13.000% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: linear;}57% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(.4,0,1,1);}72% {stroke-dashoffset: 0; opacity: 0; animation-timing-function: steps(1,end);}73%,100% {stroke-dashoffset: 100; opacity: 0;}}
@media (prefers-reduced-motion: reduce) {
#da-wiki-art .motion, #da-wiki-art .motion * {animation: none !important; transition: none !important; transform: none !important; opacity: 1 !important; stroke-dasharray: none !important; stroke-dashoffset: 0 !important;}
}
</style>
