<path d="M386 32V62H414" fill="none" stroke="#F3EEE7" stroke-opacity=".18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path class="motion draw gesture-0" d="M386 32V62H414" pathLength="100" fill="none" stroke="#BDB6AD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M391 24H414L423 33V57H391Z M414 24V33H423" fill="none" stroke="#F3EEE7" stroke-opacity=".18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path class="motion draw gesture-1" d="M391 24H414L423 33V57H391Z M414 24V33H423" pathLength="100" fill="none" stroke="#BDB6AD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M398 41H416M398 48H409" fill="none" stroke="#F3EEE7" stroke-opacity=".18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path class="motion draw gesture-2" d="M398 41H416M398 48H409" pathLength="100" fill="none" stroke="#FF6A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
