<svg xmlns="http://www.w3.org/2000/svg" id="da-organizer-art" width="460" height="220" viewBox="0 0 460 220" role="img" aria-labelledby="da-organizer-title da-organizer-desc" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="da-organizer-title">DAOrganizer — Your collection, brought together.</title>
<desc id="da-organizer-desc">Find items. Arrange inventories. Review transfers. C# / Avalonia / .NET. A small monoline category drawing repeats a forward construction and gentle fade over a complete static track. It is decorative artwork, not an application identity. Reduced motion shows the complete drawing.</desc>
<style>
