<svg xmlns="http://www.w3.org/2000/svg" width="960" height="96" viewBox="0 0 960 96" role="img" aria-labelledby="title desc">
<title id="title">Make something useful. Contact Raymond through project issues.</title><desc id="desc">Make something useful. Contact Raymond through project issues.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1423"/><stop offset="1" stop-color="#080d16"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#164c63" stop-opacity=".45"/><stop offset="1" stop-color="#164c63" stop-opacity="0"/></radialGradient>
</defs>
<style>.sans{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>

<rect x=".5" y=".5" width="959" height="95" rx="12" fill="url(#bg)" stroke="#26364d"/><text x="28" y="35" class="mono" fill="#67e8f9" font-size="11" letter-spacing="1.4">MAKE SOMETHING USEFUL.</text><text x="28" y="64" class="sans" fill="#b1c2d7" font-size="14">Have an idea or found a bug? Start a conversation in a project issue.</text>
<g transform="translate(874,47)" stroke="#43647d" fill="none"><path d="M-25 -11 L-36 0 L-25 11 M25 -11 L36 0 L25 11 M7 -21 L-7 21" stroke-width="2"/></g>
<g class="motion"><circle cx="926" cy="18" r="2" fill="#6ee7b7"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle></g>
</svg>
