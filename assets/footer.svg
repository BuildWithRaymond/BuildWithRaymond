<svg xmlns="http://www.w3.org/2000/svg" id="footer-art" width="960" height="176" viewBox="0 0 960 176" role="img" aria-labelledby="footer-title footer-desc" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="footer-title">Make something useful. Explore Raymond&#x27;s repositories.</title>
<desc id="footer-desc">An invitation to explore Raymond Hernbrode&#x27;s public repositories. The arrow shaft and head repeat a short forward construction over a static track, while the supplied mark, words, and orange rule remain stationary.</desc>
<style>
#footer-art .draw {stroke-dasharray: 100 100;}
#footer-art .arrow-shaft {animation: footer-draw-0 3.4s linear 0.08s infinite both;}
@keyframes footer-draw-0 {0% {stroke-dashoffset: 100; opacity: 0; animation-timing-function: linear;}4% {stroke-dashoffset: 100; opacity: 1; animation-timing-function: cubic-bezier(.2,.7,.2,1);}11.059% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: linear;}57% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(.4,0,1,1);}72% {stroke-dashoffset: 0; opacity: 0; animation-timing-function: steps(1,end);}73%,100% {stroke-dashoffset: 100; opacity: 0;}}
#footer-art .arrow-head {animation: footer-draw-1 3.4s linear 0.2s infinite both;}
@keyframes footer-draw-1 {0% {stroke-dashoffset: 100; opacity: 0; animation-timing-function: linear;}4% {stroke-dashoffset: 100; opacity: 1; animation-timing-function: cubic-bezier(.16,1,.3,1);}11.059% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: linear;}57% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(.4,0,1,1);}72% {stroke-dashoffset: 0; opacity: 0; animation-timing-function: steps(1,end);}73%,100% {stroke-dashoffset: 100; opacity: 0;}}
@media (prefers-reduced-motion: reduce) {
#footer-art .motion, #footer-art .motion * {animation: none !important; transition: none !important; transform: none !important; opacity: 1 !important; stroke-dasharray: none !important; stroke-dashoffset: 0 !important;}
}
</style>
<rect width="960" height="176" fill="#1F1F1F"/>
<g transform="translate(44 51) scale(0.526315789)"><g fill="#F3EEE7"><path d="M0 4H36V47L0 64Z M0 79L77 40V0H114V123H77V66L36 86V127H0Z" /></g>
</g>
<text x="140" y="89" fill="#F3EEE7" font-size="52" font-weight="600" letter-spacing="-2">Make something useful.</text>
<text x="143" y="133" fill="#F3EEE7" font-size="28" font-weight="400" letter-spacing="-.5">Explore the repositories.</text>
<path d="M872 94H911" fill="none" stroke="#F3EEE7" stroke-opacity=".18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="motion draw arrow-shaft" d="M872 94H911" pathLength="100" fill="none" stroke="#F3EEE7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M895 78L911 94L895 110" fill="none" stroke="#F3EEE7" stroke-opacity=".18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="motion draw arrow-head" d="M895 78L911 94L895 110" pathLength="100" fill="none" stroke="#F3EEE7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="0" y="170" width="960" height="6" fill="#FF6A00"/>
<rect x=".5" y=".5" width="959" height="175" fill="none" stroke="#F3EEE7" stroke-opacity=".18"/>
</svg>
