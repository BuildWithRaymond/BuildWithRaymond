<svg xmlns="http://www.w3.org/2000/svg" width="460" height="230" viewBox="0 0 460 230" role="img" aria-labelledby="title desc">
<title id="title">DASB — A toolkit beneath the game.</title><desc id="desc">Original Dark Ages themed the runesmith's bench artwork. Protocol tools, automation and a web dashboard. TypeScript / Node.js</desc>
<defs>
