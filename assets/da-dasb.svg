<svg xmlns="http://www.w3.org/2000/svg" id="da-dasb-art" width="460" height="220" viewBox="0 0 460 220" role="img" aria-labelledby="da-dasb-title da-dasb-desc" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="da-dasb-title">DASB — A toolkit beneath the game.</title>
<desc id="da-dasb-desc">Protocol tools, automation, and a web dashboard. TypeScript / Node.js. A small monoline category drawing constructs once and settles beside the stationary project name. It is decorative artwork, not an application identity. Reduced motion shows the complete drawing.</desc>
<style>
#da-dasb-art .draw {stroke-dasharray: 100 100;}
#da-dasb-art .gesture-0 {animation: da-dasb-draw 0.42s cubic-bezier(.16,1,.3,1) 0.1s 1 both;}
#da-dasb-art .gesture-1 {animation: da-dasb-draw 0.42s cubic-bezier(.16,1,.3,1) 0.22s 1 both;}
#da-dasb-art .gesture-2 {animation: da-dasb-draw 0.32s cubic-bezier(.22,.7,.2,1) 0.46s 1 both;}
@keyframes da-dasb-draw {from {stroke-dashoffset: 100;} to {stroke-dashoffset: 0;}}
@media (prefers-reduced-motion: reduce) {
#da-dasb-art .motion, #da-dasb-art .motion * {animation: none !important; transition: none !important; transform: none !important; opacity: 1 !important; stroke-dasharray: none !important; stroke-dashoffset: 0 !important;}
}
</style>
