<svg xmlns="http://www.w3.org/2000/svg" id="da-speaker-art" width="460" height="220" viewBox="0 0 460 220" role="img" aria-labelledby="da-speaker-title da-speaker-desc" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="da-speaker-title">DASpeaker — Your words, at your pace.</title>
<desc id="da-speaker-desc">Prepare speeches. Preview messages. Stay in control. C# / .NET / Windows. A small monoline category drawing repeats a forward construction and gentle fade over a complete static track. It is decorative artwork, not an application identity. Reduced motion shows the complete drawing.</desc>
