<svg xmlns="http://www.w3.org/2000/svg" id="da-speaker-art" width="460" height="220" viewBox="0 0 460 220" role="img" aria-labelledby="da-speaker-title da-speaker-desc" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="da-speaker-title">DASpeaker — Your words, at your pace.</title>
<desc id="da-speaker-desc">Prepare speeches. Preview messages. Stay in control. C# / .NET / Windows. A small monoline category drawing constructs once and settles beside the stationary project name. It is decorative artwork, not an application identity. Reduced motion shows the complete drawing.</desc>
<style>
#da-speaker-art .draw {stroke-dasharray: 100 100;}
#da-speaker-art .gesture-0 {animation: da-speaker-draw 0.22s cubic-bezier(.16,1,.3,1) 0.1s 1 both;}
#da-speaker-art .gesture-1 {animation: da-speaker-draw 0.3s cubic-bezier(.16,1,.3,1) 0.18s 1 both;}
#da-speaker-art .gesture-2 {animation: da-speaker-draw 0.38s cubic-bezier(.22,.7,.2,1) 0.26s 1 both;}
#da-speaker-art .gesture-3 {animation: da-speaker-draw 0.3s cubic-bezier(.16,1,.3,1) 0.34s 1 both;}
#da-speaker-art .gesture-4 {animation: da-speaker-draw 0.22s cubic-bezier(.16,1,.3,1) 0.42s 1 both;}
@keyframes da-speaker-draw {from {stroke-dashoffset: 100;} to {stroke-dashoffset: 0;}}
@media (prefers-reduced-motion: reduce) {
#da-speaker-art .motion, #da-speaker-art .motion * {animation: none !important; transition: none !important; transform: none !important; opacity: 1 !important; stroke-dasharray: none !important; stroke-dashoffset: 0 !important;}
}
</style>
