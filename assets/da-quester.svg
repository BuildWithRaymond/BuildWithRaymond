<svg xmlns="http://www.w3.org/2000/svg" id="da-quester-art" width="460" height="220" viewBox="0 0 460 220" role="img" aria-labelledby="da-quester-title da-quester-desc" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="da-quester-title">DAQuester — A journal for the journey ahead.</title>
<desc id="da-quester-desc">Plan quests and keep each character&#x27;s progress. C# / Avalonia / .NET. A small monoline category drawing repeats a forward construction and gentle fade over a complete static track. It is decorative artwork, not an application identity. Reduced motion shows the complete drawing.</desc>
<style>
#da-quester-art .draw {stroke-dasharray: 100 100;}
#da-quester-art .gesture-0 {animation: da-quester-draw-0 4.0s linear 0.12s infinite both;}
@keyframes da-quester-draw-0 {0% {stroke-dashoffset: 100; opacity: 0; animation-timing-function: linear;}4% {stroke-dashoffset: 100; opacity: 1; animation-timing-function: cubic-bezier(.22,.7,.2,1);}20.000% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: linear;}57% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(.4,0,1,1);}72% {stroke-dashoffset: 0; opacity: 0; animation-timing-function: steps(1,end);}73%,100% {stroke-dashoffset: 100; opacity: 0;}}
#da-quester-art .gesture-1 {animation: da-quester-draw-1 4.0s linear 0.1s infinite both;}
@keyframes da-quester-draw-1 {0% {stroke-dashoffset: 100; opacity: 0; animation-timing-function: linear;}4% {stroke-dashoffset: 100; opacity: 1; animation-timing-function: cubic-bezier(.16,1,.3,1);}10.500% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: linear;}57% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(.4,0,1,1);}72% {stroke-dashoffset: 0; opacity: 0; animation-timing-function: steps(1,end);}73%,100% {stroke-dashoffset: 100; opacity: 0;}}
#da-quester-art .gesture-2 {animation: da-quester-draw-2 4.0s linear 0.64s infinite both;}
@keyframes da-quester-draw-2 {0% {stroke-dashoffset: 100; opacity: 0; animation-timing-function: linear;}4% {stroke-dashoffset: 100; opacity: 1; animation-timing-function: cubic-bezier(.16,1,.3,1);}10.500% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: linear;}57% {stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(.4,0,1,1);}72% {stroke-dashoffset: 0; opacity: 0; animation-timing-function: steps(1,end);}73%,100% {stroke-dashoffset: 100; opacity: 0;}}
@media (prefers-reduced-motion: reduce) {
#da-quester-art .motion, #da-quester-art .motion * {animation: none !important; transition: none !important; transform: none !important; opacity: 1 !important; stroke-dasharray: none !important; stroke-dashoffset: 0 !important;}
}
</style>
